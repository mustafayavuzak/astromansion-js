# .meta/decisions.toml: The project's decision record (5.5).

project_name = "AstroMansion"
package_name = "astromansion"
project_type = "desktop"
product_kind = "TypeScript client library for the AstroMansion API, published to npm as astromansion"
delivery_form = "multi_file"
target_platforms = ["node", "bun", "deno", "edge", "react-native"]
programming_languages = ["typescript"]
documentation_language = "en"
user_facing_language = "en"
architecture_record = ".meta/decisions.toml"
version_control = "git"

[transfer]
# The owner's decision of 2026-10-23. The SDK's handover is logged in the site repository's TRANSFER.md.
enabled = false

[license]
required = true
type = "MIT"
holder = "AstroMansion"

[tests]
enabled = true

[git]
# The owner runs every git command (init, commit, push) and every publish.
operator = "owner"
remote = "https://github.com/mustafayavuzak/astromansion-js"

[release]
# The owner's decision of 2026-10-23. The npm name is claimed at once with an
# early alpha of the core client, under the next tag, before the typed methods.
first_version = "0.1.0-alpha.0"
prerelease_tag = "next"
# npm pointed latest at the first version, a prerelease. Until 0.1.0, each
# alpha moves latest too, so a default install gets the newest alpha.
latest_follows_alphas = true

[toolchain]
node_supported = ">=22"
# Pinned until typescript-eslint supports TypeScript 7 (decision 6A).
typescript = "6.0.3"
lint = "eslint with typescript-eslint strictTypeChecked and stylisticTypeChecked, and import-x/no-cycle"
format = "prettier"
tests = "vitest"
build = "tsup, ESM and CJS with declarations"
api_report = "api-extractor"
package_checks = ["publint", "@arethetypeswrong/cli"]

[sdk]
python_twin = "https://github.com/mustafayavuzak/astromansion-python"
# 1A. The API's CORS admits only its own site, so 0.1.0 does not target browsers.
browser_target = false
# 2A. The API schema owns the method names (operationId) and the document media types.
method_names = "openapi_operation_id"
# 3A. Fields the schema leaves untyped reach the caller as JSON values.
untyped_responses = "json_value"
# 4A. No module-level shortcuts and no process-wide key. One client per key.
module_shortcuts = false
# 5A. Documents come back as bytes or text. Writing a file is the caller's one line.
node_file_entry = false
# 8A. No runtime dependency. The client reads its own few shapes through complete type guards.
runtime_dependencies = []
# Typed responses are checked at run time by guards the generator writes (49.8).
response_checks = "generated_guards"
# A key is refused where it would ship to every user of the app, unless the caller allows it.
client_side_key_guard = ["browser", "react-native"]

[architecture]
# Approved 2026-10-23. [Mn] is the milestone that writes the file.
# M2 split the generated checks out of models/schemas/api.ts into
# responses/answerChecks.ts, so the models hold declarations only and the
# behavior that reads an answer sits with the other answer readers.
tree = """
src/                                the package (only its build, dist/, ships)
  index.ts                          [M1] the one public entry the exports map names
  client.ts                         [M1] AstroMansion, options, request()  [M3] bodies(), renderSharecard()
  endpointMethods.ts                [M2] generated, one method per endpoint
  settings.ts                       [M1] the one reader of ASTROMANSION_API_KEY and ASTROMANSION_BASE_URL
  credentials.ts                    [M1] key precedence, masking, the /v1/ path guard, the client-side key guard
  requestBodies.ts                  [M3] birth validation and the request bodies
  catalogPages.ts                   [M3] the /v1/chart catalog walk
  transport/transport.ts            [M1] fetch, per-attempt timeout, retry loop
  transport/backoff.ts              [M1] Retry-After and jittered exponential waits
  responses/decoder.ts              [M1] error envelope, JSON, text/plain, document bytes
  responses/envelope.ts             [M1] the {technique, result} wrapper
  responses/errorPolicy.ts          [M1] status and code to error class, retry and quota decisions
  responses/json.ts                 [M1] parsing and recognizing JSON values  [M2] the tests the checks call
  responses/answers.ts              [M2] what a generated method returns: its checked JSON or its document
  responses/answerChecks.ts         [M2] generated, one check per shape an answer reaches
  models/constants/                 [M1] api, transport, envelope, errors, package  [M3] birth, catalog
  models/enums/                     [M1] http  [M3] birth
  models/errors/api.ts              [M1] AstroMansionError and its subclasses
  models/records/                   [M1] json, client, response
  models/schemas/api.ts             [M2] generated request, query, and answer types
tests/                              mirrors src/, with vitest.config.ts and tsconfig.json
  fakes/fetch.ts                    [M1] scripted fake fetch
  meta/tools/generate/              [M2] the generator's tests, and the test that the generated modules match the snapshot
  package/smoke.test.ts             [M4] the built package on Node 22, 24, 26, Bun and Deno
.meta/
  decisions.toml                    [M0] this record
  api-report/                       [M1] API Extractor configuration and the committed API report
  openapi/openapi.v1.json           [M2] snapshot of the API schema, the generator's only input
  tools/generate/                   [M2] the generator: openApi (reads the snapshot), shapes (what a component is),
                                    operations (the methods), docs (TSDoc), typeWriter, checkWriter, methodWriter,
                                    generatedFiles (the three modules, formatted), main (npm run generate)
  docs/                             [M4] CHANGELOG.md, examples.md
.github/                            [M4] ci, publish, schema drift, dependabot
package.json, package-lock.json, tsconfig.json, tsup.config.ts, eslint.config.js, .gitignore
README.md, LICENSE
"""

[provenance]
project_type = "user"
delivery_form = "user"
programming_languages = "user"
documentation_language = "user"
user_facing_language = "user"
version_control = "user"
transfer = "user"
license = "user"
tests = "user"
git = "user"
toolchain = "user"
sdk = "user"
architecture = "user"
