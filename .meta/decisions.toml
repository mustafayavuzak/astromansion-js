# .meta/decisions.toml: The project's decision record (5.5).

project_name = "AstroMansion"
package_name = "astromansion"
project_type = "desktop"
product_kind = "TypeScript client library for the AstroMansion API, published to npm as astromansion"
delivery_form = "multi_file"
target_platforms = ["node", "bun", "deno", "edge", "react-native"]
programming_languages = ["typescript"]
documentation_language = "en"
user_facing_language = "en"
architecture_record = ".meta/decisions.toml"
version_control = "git"

[transfer]
# The owner's decision of 2026-10-23. The SDK's handover is logged in the site repository's TRANSFER.md.
enabled = false

[license]
required = true
type = "MIT"
holder = "AstroMansion"

[tests]
enabled = true

[git]
# The owner runs every git command (init, commit, push) and every publish.
operator = "owner"
remote = "https://github.com/mustafayavuzak/astromansion-js"

[release]
# The owner's decision of 2026-10-23. The npm name is claimed at once with an
# early alpha of the core client, under the next tag, before the typed methods.
first_version = "0.1.0-alpha.0"
prerelease_tag = "next"
# npm pointed latest at the first version, a prerelease. Until 0.1.0, each
# alpha moves latest too, so a default install gets the newest alpha.
latest_follows_alphas = true
# As in the Python SDK, a v* tag publishes through .github/workflows/publish.yml,
# with npm's trusted publishing and no stored token. A prerelease goes out under next.
publisher = "github_actions_oidc"

[toolchain]
node_supported = ">=22"
# Pinned until typescript-eslint supports TypeScript 7 (decision 6A).
typescript = "6.0.3"
lint = "eslint with typescript-eslint strictTypeChecked and stylisticTypeChecked, and import-x/no-cycle"
format = "prettier"
tests = "vitest"
build = "tsup, ESM and CJS with declarations"
api_report = "api-extractor"
package_checks = ["publint", "@arethetypeswrong/cli"]

[sdk]
python_twin = "https://github.com/mustafayavuzak/astromansion-python"
# The owner's instruction of 2026-10-23: the package is the npm twin of the
# Python SDK, with its features, its behavior, its structure, and its README.
# Nothing the Python SDK lacks is added. Every earlier decision that differed
# from it was reopened, and the owner answered the five open questions the
# same day: 1A, 2A, 3A, 4A, 5A.
mirrors = "python_sdk"
# 1A of 2026-10-23. The Python SDK's names, written in camelCase: render_png is renderPng, api_key is apiKey.
naming = "python_names_in_camel_case"
# The API schema owns the method names (operationId) and the document media types.
method_names = "openapi_operation_id"
# 2A of 2026-10-23. Each answer is checked against its published shape before it is returned (49.8),
# and one outside it rejects with the code unexpected_answer. The Python SDK returns it as it arrived.
response_checks = "generated_guards"
# Fields the schema leaves untyped reach the caller as JSON values.
untyped_responses = "json_value"
# A JSON answer is a Result, as in Python. A field the answer does not carry reads as undefined,
# where Python raises AttributeError (the owner's answer A of 2026-10-23).
result_absent_field = "undefined"
# The old 4A is reopened: the module-level shortcuts, setApiKey(), reset(), and defaultClient() exist, as in Python.
module_shortcuts = true
# The old 5A is reopened: every document method takes output, as in Python. Where the runtime has no
# file system, output is refused before the request is sent (the owner's answer A of 2026-10-23).
document_output = "output_argument"
# 4A of 2026-10-23. No runtime dependency. A proxy or Tor goes through the caller's own fetch,
# which the README shows, where Python installs httpx with SOCKS support.
runtime_dependencies = []
# 3A of 2026-10-23. A key is refused where it would ship to every user of the app, unless the caller allows it.
client_side_key_guard = ["browser", "react-native"]
# The API's CORS admits only its own site, so the package does not target browsers.
browser_target = false
# JavaScript's one client is asynchronous, the counterpart of Python's AsyncAstroMansion.
client_classes = ["AstroMansion"]

[architecture]
# 5A of 2026-10-23: the repository's root follows the Python SDK's, with the
# generator in tools/, the example program in examples/, and EXAMPLES.md,
# CHANGELOG.md, and the README's banner.webp at the root. This is the owner's
# exception to the root rule of 34.15 for this repository. The decision record
# and the API report stay in .meta/.
# Each Python module has its counterpart, named in the column on the right.
tree = """
src/                                the package (only its build, dist/, ships)
  index.ts                          __init__.py, the one public entry the exports map names
  client.ts                         client.py, AstroMansion, request(), bodies(), renderSharecard(), close()
  endpointMethods.ts                _methods.py, generated, one method per endpoint
  endpointShortcuts.ts              _shortcuts.py, generated, one module-level function per endpoint
  shortcuts.ts                      shortcuts.py, setApiKey(), reset(), defaultClient(), request(), bodies()
  requestBodies.ts                  _bodies.py, the request bodies and the birth's checks
  catalogPages.ts                   _paging.py, the /v1/chart catalog walk
  response.ts                       response.py, the Result every JSON answer becomes
  settings.ts                       settings.py, the one reader of ASTROMANSION_API_KEY and ASTROMANSION_BASE_URL
  credentials.ts                    _credentials.py, key precedence, masking, the /v1/ path guard, the client-side key guard
  transport/transport.ts            client.py's request loop, fetch, per-attempt timeout, retries
  transport/backoff.ts              _backoff.py, Retry-After and jittered exponential waits
  responses/decoder.ts              _responses.py, error envelope, JSON, text/plain, document bytes
  responses/documents.ts            _responses.py's save_document, writing a document to output
  responses/errorPolicy.ts          errors.py's ErrorPolicy, status and code to error class, retry and quota
  responses/answers.ts              what a generated method returns: its checked Result or its document
  responses/answerChecks.ts         generated, one check per shape an answer reaches
  responses/json.ts                 parsing and recognizing JSON values
  models/constants/                 models/constants/, api, birth, bodies, catalog, endpoints (generated),
                                    envelope, errors, http (Python's http.HTTPStatus), package, transport
  models/enums/endpoints.ts         the request shapes of the endpoint table
  models/errors/api.ts              errors.py, AstroMansionError and its subclasses
  models/records/                   models/dataclasses/, arguments, client, endpoints, json, response, transport
  models/schemas/api.ts             generated request, query, and answer types
tests/                              tests/, each Python test file's counterpart, and the tests of src/'s modules
tools/generate/                     tools/generate_endpoints.py, the generator, and openapi.v1.json, its snapshot
examples/natal_chart.ts             examples/natal_chart.py
.meta/
  decisions.toml                    this record
  api-report/                       API Extractor configuration and the committed API report
.github/workflows/publish.yml       .github/workflows/publish.yml, test, build, and publish on a v* tag
package.json, package-lock.json, tsconfig.json, tsup.config.ts, eslint.config.js, .gitignore
README.md, EXAMPLES.md, CHANGELOG.md, LICENSE
banner.webp                         banner.webp, the published packages' banner until their next release, the README now showing the API's live sky
"""

[provenance]
project_type = "user"
delivery_form = "user"
programming_languages = "user"
documentation_language = "user"
user_facing_language = "user"
version_control = "user"
transfer = "user"
license = "user"
tests = "user"
git = "user"
toolchain = "user"
sdk = "user"
architecture = "user"
